[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-video-generator"
version = "0.1.0"
description = "Silent, loop-safe vertical video generation for How People Relate"
requires-python = ">=3.11"

[project.optional-dependencies]
render = ["imageio-ffmpeg>=0.5"]

[project.scripts]
hpr-video = "hpr_video_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

